
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaakyire Learning AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Kaakyire Learning AI</h1>
    <p>Your personal AI learning assistant</p>

    <label for="question">What would you like to learn today?</label>

    <textarea
      id="question"
      placeholder="Ask a school question..."
      rows="4"
    ></textarea>

    <button id="ask-button" type="button">
      Ask Kaakyire
    </button>

    <section id="answer" aria-live="polite">
      Your answer will appear here.
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
